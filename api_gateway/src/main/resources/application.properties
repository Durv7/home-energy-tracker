spring.application.name=api_gateway
server.port=9000

##Device service configuration
spring.cloud.gateway.server.webflux.routes[0].id=device-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081/
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/device/**

##User service configuration
spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8080/
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/user/**

##Ingestion service configuration
spring.cloud.gateway.server.webflux.routes[2].id=ingestion-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8082/
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/ingestion/**