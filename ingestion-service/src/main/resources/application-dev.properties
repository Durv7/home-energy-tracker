spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.template-default-topic=energy-usage
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

simulation.ingestionEndpoint=http://localhost:9000/api/ingestion
simulation.requests-per-interval=2000
simulation.interval-ms=6000ms
simulator.parallelThreadSize=10